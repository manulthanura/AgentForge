services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Matches the default DATABASE_URL in .env.example.
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: agentforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d agentforge"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      # This file lives in docker/, so the build context is the repo root.
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/agentforge
    command: ["python", "main.py", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/agentforge
      # Ollama constructs without credentials; override with a real provider
      # + API key via the host environment when running workflows.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SECRET_KEY: ${SECRET_KEY:-}
    command:
      ["uvicorn", "--factory", "interfaces.http.app:create_app",
       "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
